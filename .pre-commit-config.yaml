# Tool versions come from uv.lock (dev dependency group). Run `uv sync` before committing.
# Ruff / pyright / complexipy / eslint+oxlint mirror CI (.github/workflows/ci.yml).
exclude: ^(\.agents/|\.cursor/|\.venv/|ui/node_modules/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix, lf]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: complexipy
        name: complexipy
        entry: bash -lc "uv run complexipy main.py tests --max-complexity-allowed 15"
        language: system
        pass_filenames: false
        types: [python]
      - id: pyright
        name: pyright
        entry: bash -lc "uv run pyright ."
        language: system
        pass_filenames: false
        types: [python]
      - id: oxlint
        name: eslint + oxlint (ui)
        entry: bash -lc "cd ui && if [ -d node_modules ] && [ -f node_modules/.package-lock.json ] && cmp -s package-lock.json node_modules/.package-lock.json; then npm run lint:ci; else npm ci && npm run lint:ci; fi"
        language: system
        pass_filenames: false
        files: ^ui/
