[project]
name = "issue-discussion-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the Issue Discussion Platform"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.128.0",
    "itsdangerous>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = [
    "alembic>=1.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.fastapi]
entrypoint = "app.main:app"
