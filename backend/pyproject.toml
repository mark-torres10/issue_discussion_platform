[project]
name = "issue-discussion-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the Issue Discussion Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.fastapi]
entrypoint = "app.main:app"
